    <noscript>
      <h1>طبيبي (Tabibi) — منصة طبية رقمية في غزة، فلسطين</h1>
      <p>
        طبيبي منصة طبية رقمية فلسطينية مقرها غزة، تربط المرضى بالأطباء عبر حجز المواعيد
        والاستشارات الطبية عن بُعد، وتدير العيادات الإلكترونية بأدوار متعددة: مريض، طبيب، سكرتير، وإدارة.
        تأسست على يد مازن أبو سيف (Mazen Abu Saif).
      </p>
      <h2>خدمات منصة طبيبي</h2>
      <ul>
        <li>حجز مواعيد مع أطباء متخصصين في غزة وفلسطين</li>
        <li>استشارات طبية عن بُعد عبر مكالمات الفيديو</li>
        <li>مساعد طبي ذكي يوجّه المريض للتخصص الطبي المناسب حسب الأعراض</li>
        <li>الوصفات الإلكترونية والسجل الطبي الرقمي</li>
        <li>إدارة العيادات: جدولة المواعيد، المتابعة المالية، ولوحة السكرتير</li>
      </ul>
      <h2>التخصصات الطبية</h2>
      <p>
        جهاز هضمي، جلدية وتجميل، نسائية وتوليد، مخ وأعصاب، أطفال، أسنان، عظام، باطنة، قلب،
        عيون، وأمراض دم.
      </p>
      <h2>الأسئلة الشائعة</h2>
      <dl>
        <dt>كيف أقوم بحجز موعد؟</dt>
        <dd>اختر الطبيب المناسب ثم حدد التاريخ والوقت المتاحين وأرسل طلب الحجز.</dd>
        <dt>هل يمكنني إلغاء الموعد؟</dt>
        <dd>نعم، يمكنك إلغاء الموعد من صفحة حجوزاتي قبل وقت الموعد.</dd>
        <dt>هل بياناتي الطبية آمنة؟</dt>
        <dd>نعم، يتم التعامل مع بياناتك الطبية بسرية وحمايتها داخل المنصة.</dd>
        <dt>كيف أحصل على الدعم؟</dt>
        <dd>اضغط على زر تواصل معنا وأرسل استفسارك لفريق الدعم.</dd>
      </dl>
